<h1>Microservices</h1><p>Application-owned services, health and declared dependencies.</p><label>App ID <input id="target" placeholder="Microservice ID"></label><button data-action="stop">Stop service</button><button data-action="remove">Remove service</button><output></output><pre></pre><script>
for(const b of document.querySelectorAll('button[data-action]'))b.onclick=async()=>{const o=document.querySelector('output');try{const result=await wasmos.call('manage',{id:document.querySelector('input').value.trim(),action:b.dataset.action});o.textContent=result?'Completed':'No change';show();}catch(e){o.textContent=e.message;}};
async function show(){try{const g=await wasmos.call('graph');const items=g.apps.filter(a=>a.kind==='microservice'||a.services?.length);document.querySelector('pre').textContent=items.length?items.map(a=>a.name+' · '+(a.running?'running':'stopped')+'\n'+JSON.stringify({services:a.services,health:a.health,dependencies:g.dependencies.filter(d=>d.appId===a.appId)},null,2)).join('\n\n'):'No service provider is running.';}catch(e){document.querySelector('pre').textContent=e.message;}}show();setInterval(show,2400);
</script>
